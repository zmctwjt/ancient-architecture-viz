<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>千年营造·华夏砖木 - 中国古代建筑数据可视化</title>
  <link rel="stylesheet" href="./src/css/common.css">
  <link rel="stylesheet" href="./src/css/responsive.css">
  <meta name="description" content="基于数据可视化的中国古代建筑成就展示平台">
  <script>(function(){var d=document.documentElement;var r=window.devicePixelRatio||1;d.setAttribute('data-dpr',r);function s(){var w=d.clientWidth;var rem=(w/1920)*100;rem=Math.max(rem,54);d.style.fontSize=rem+'px'}s();window.addEventListener('resize',s);window.addEventListener('pageshow',function(e){if(e.persisted)s()});window.flexible={dpr:r,rem:function(){return parseFloat(d.style.fontSize)},refreshRem:s}})();</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    }
    .title {
      font-size: 0.48rem;
      color: #C8A96E;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 30px rgba(200, 169, 110, 0.5);
      animation: fadeDown 1s ease both;
    }
    .subtitle {
      font-size: 0.18rem;
      color: #4ECDC4;
      margin-bottom: 0.6rem;
      animation: fadeDown 1s ease 0.2s both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .timeline-container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      height: 4rem;
    }
    .timeline-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #C8A96E, #4ECDC4, #E07B54, #C8A96E);
      transform: translateY(-50%) scaleX(0);
      transform-origin: left center;
      animation: lineGrow 1.5s ease 0.5s forwards;
    }
    @keyframes lineGrow {
      to { transform: translateY(-50%) scaleX(1); }
    }
    .dynasty-node {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      animation: nodePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes nodePop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .dynasty-node:nth-child(2) { animation-delay: 0.8s; }
    .dynasty-node:nth-child(3) { animation-delay: 0.95s; }
    .dynasty-node:nth-child(4) { animation-delay: 1.1s; }
    .dynasty-node:nth-child(5) { animation-delay: 1.25s; }
    .dynasty-node:nth-child(6) { animation-delay: 1.4s; }
    .dynasty-node:nth-child(7) { animation-delay: 1.55s; }
    .dynasty-node:nth-child(8) { animation-delay: 1.7s; }
    .dynasty-node:hover {
      transform: translate(-50%, -50%) scale(1.15) !important;
    }
    .dynasty-circle {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 3px solid #C8A96E;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.14rem;
      font-weight: bold;
      color: #C8A96E;
      box-shadow: 0 0 20px rgba(200, 169, 110, 0.3);
    }
    .dynasty-node.active .dynasty-circle {
      background: linear-gradient(135deg, #C8A96E 0%, #D4B896 100%);
      color: #0d1117;
      box-shadow: 0 0 30px rgba(200, 169, 110, 0.6);
    }
    .dynasty-info {
      position: absolute;
      top: 0.8rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .dynasty-node:hover .dynasty-info,
    .dynasty-node.active .dynasty-info { opacity: 1; }
    .dynasty-name {
      font-size: 0.16rem;
      color: #C8A96E;
      margin-bottom: 0.04rem;
    }
    .dynasty-period {
      font-size: 0.11rem;
      color: #4ECDC4;
    }
    .enter-btn {
      margin-top: 0.6rem;
      padding: 0.15rem 0.5rem;
      background: linear-gradient(135deg, #C8A96E 0%, #D4B896 100%);
      border: none;
      border-radius: 30px;
      color: #0d1117;
      font-size: 0.18rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 0.8s ease 2s forwards;
    }
    .enter-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(200, 169, 110, 0.5);
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @media (max-width: 768px) {
      .title { font-size: 0.36rem; }
      .subtitle { font-size: 0.14rem; }
      .dynasty-circle { width: 0.45rem; height: 0.45rem; font-size: 0.11rem; }
      .timeline-container { height: 3rem; }
      .dynasty-info { top: 0.6rem; }
      .dynasty-name { font-size: 0.13rem; }
    }
  </style>
</head>
<body>
  <h1 class="title">千年营造</h1>
  <p class="subtitle">点击朝代节点，探索华夏建筑文明</p>

  <div class="timeline-container">
    <div class="timeline-line"></div>

    <div class="dynasty-node" style="left: 5%" data-target="./src/view/home/index.html?dynasty=先秦">
      <div class="dynasty-circle">先秦</div>
      <div class="dynasty-info">
        <div class="dynasty-name">先秦时期</div>
        <div class="dynasty-period">前2070-前221</div>
      </div>
    </div>

    <div class="dynasty-node" style="left: 20%" data-target="./src/view/home/index.html?dynasty=秦汉">
      <div class="dynasty-circle">秦汉</div>
      <div class="dynasty-info">
        <div class="dynasty-name">秦汉时期</div>
        <div class="dynasty-period">前221-220</div>
      </div>
    </div>

    <div class="dynasty-node" style="left: 35%" data-target="./src/view/home/index.html?dynasty=魏晋">
      <div class="dynasty-circle">魏晋</div>
      <div class="dynasty-info">
        <div class="dynasty-name">魏晋南北朝</div>
        <div class="dynasty-period">220-589</div>
      </div>
    </div>

    <div class="dynasty-node" style="left: 50%" data-target="./src/view/home/index.html?dynasty=隋唐">
      <div class="dynasty-circle">隋唐</div>
      <div class="dynasty-info">
        <div class="dynasty-name">隋唐时期</div>
        <div class="dynasty-period">581-907</div>
      </div>
    </div>

    <div class="dynasty-node" style="left: 65%" data-target="./src/view/home/index.html?dynasty=宋元">
      <div class="dynasty-circle">宋元</div>
      <div class="dynasty-info">
        <div class="dynasty-name">宋元时期</div>
        <div class="dynasty-period">960-1368</div>
      </div>
    </div>

    <div class="dynasty-node" style="left: 80%" data-target="./src/view/home/index.html?dynasty=明清">
      <div class="dynasty-circle">明清</div>
      <div class="dynasty-info">
        <div class="dynasty-name">明清时期</div>
        <div class="dynasty-period">1368-1911</div>
      </div>
    </div>

    <div class="dynasty-node active" style="left: 95%" data-target="./src/view/home/index.html">
      <div class="dynasty-circle">总览</div>
      <div class="dynasty-info">
        <div class="dynasty-name">全时期总览</div>
        <div class="dynasty-period">前2070-1911</div>
      </div>
    </div>
  </div>

  <button class="enter-btn" id="enterBtn">进入探索</button>

  <script>
    // 纯 JS 交互，不依赖任何外部库
    (function() {
      var nodes = document.querySelectorAll('.dynasty-node');
      var enterBtn = document.getElementById('enterBtn');

      nodes.forEach(function(node) {
        node.addEventListener('click', function() {
          nodes.forEach(function(n) { n.classList.remove('active'); });
          node.classList.add('active');
          var name = node.querySelector('.dynasty-name').textContent;
          enterBtn.textContent = '\u8FDB\u5165' + name; // "进入" + name
        });
      });

      enterBtn.addEventListener('click', function() {
        var active = document.querySelector('.dynasty-node.active');
        if (active) {
          window.location.href = active.dataset.target;
        }
      });
    })();
  </script>
</body>
</html>
