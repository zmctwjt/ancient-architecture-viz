<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建筑著作 - 千年营造·华夏砖木</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="/js/flexible.js"></script>
  <script type="importmap">
  {
    "imports": {
      "echarts": "https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.esm.min.js",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.7/+esm"
    }
  }
  </script>
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 0.15rem;
      height: calc(100vh - 1.5rem);
      padding: 0.15rem;
    }
    .panel-timeline {
      grid-column: span 2;
    }
    .back-link {
      position: fixed;
      top: 0.2rem;
      left: 0.2rem;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.14rem;
      z-index: 100;
      padding: 0.08rem 0.15rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
    }
    .back-link:hover {
      background: rgba(200, 169, 110, 0.1);
    }
  </style>
</head>
<body>
  <a href="../../../index.html" class="back-link">← 返回首页</a>
  
  <div class="page-container">
    <header class="page-header">
      <h1 class="page-title">中国古代建筑著作</h1>
      <p class="page-subtitle">从《考工记》到《工程做法》，传承千年的建筑智慧</p>
    </header>
    
    <div class="dashboard-grid">
      <!-- 上方：时间轴 -->
      <div class="chart-panel panel-timeline">
        <h2 class="panel-title">历代建筑著作时间线</h2>
        <div id="timeline-chart" class="chart-container"></div>
      </div>
      
      <!-- 左下：旭日图 -->
      <div class="chart-panel">
        <h2 class="panel-title">著作分类体系</h2>
        <div id="sunburst-chart" class="chart-container"></div>
      </div>
      
      <!-- 右下：词云 -->
      <div class="chart-panel">
        <h2 class="panel-title">著作核心内容关键词</h2>
        <div id="wordcloud-chart" class="chart-container"></div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
