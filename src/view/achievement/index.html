<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建筑成就 - 千年营造·华夏砖木</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="/js/flexible.js"></script>
  <script type="importmap">
  {
    "imports": {
      "echarts": "https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.esm.min.js",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.7/+esm"
    }
  }
  </script>
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0.15rem;
      height: calc(100vh - 1.5rem);
      padding: 0.15rem;
    }
    .chart-panel {
      min-height: 2.5rem;
    }
    .panel-map {
      grid-row: span 2;
    }
    .back-link {
      position: fixed;
      top: 0.2rem;
      left: 0.2rem;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.14rem;
      z-index: 100;
      padding: 0.08rem 0.15rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
    }
    .back-link:hover {
      background: rgba(200, 169, 110, 0.1);
    }
  </style>
</head>
<body>
  <a href="../../../index.html" class="back-link">← 返回首页</a>
  
  <div class="page-container">
    <header class="page-header">
      <h1 class="page-title">中国古代建筑成就</h1>
      <p class="page-subtitle">全国重点文物保护单位 · 古建筑类数据可视化</p>
    </header>
    
    <div class="dashboard-grid">
      <!-- 左上：朝代分布玫瑰图 -->
      <div class="chart-panel">
        <h2 class="panel-title">各朝代建筑数量分布</h2>
        <div id="rose-chart" class="chart-container"></div>
      </div>
      
      <!-- 中间：中国地图 -->
      <div class="chart-panel panel-map">
        <h2 class="panel-title">古建筑地理分布</h2>
        <div id="map-chart" class="chart-container"></div>
      </div>
      
      <!-- 右上：技术分类极坐标图 -->
      <div class="chart-panel">
        <h2 class="panel-title">建筑技术成就分类</h2>
        <div id="polar-chart" class="chart-container"></div>
      </div>
      
      <!-- 左下：类型趋势面积图 -->
      <div class="chart-panel">
        <h2 class="panel-title">历代建筑类型发展趋势</h2>
        <div id="area-chart" class="chart-container"></div>
      </div>
      
      <!-- 右下：省份排名 -->
      <div class="chart-panel">
        <h2 class="panel-title">各省古建筑数量TOP10</h2>
        <div id="rank-chart" class="chart-container"></div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
