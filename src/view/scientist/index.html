<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杰出科学家 - 千年营造·华夏砖木</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="/js/flexible.js"></script>
  <script type="importmap">
  {
    "imports": {
      "echarts": "https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.esm.min.js",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.7/+esm"
    }
  }
  </script>
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0.15rem;
      height: calc(100vh - 1.5rem);
      padding: 0.15rem;
    }
    .panel-timeline {
      grid-row: span 2;
    }
    .panel-graph {
      grid-column: span 1;
    }
    .back-link {
      position: fixed;
      top: 0.2rem;
      left: 0.2rem;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.14rem;
      z-index: 100;
      padding: 0.08rem 0.15rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
    }
    .back-link:hover {
      background: rgba(200, 169, 110, 0.1);
    }
  </style>
</head>
<body>
  <a href="../../../index.html" class="back-link">← 返回首页</a>
  
  <div class="page-container">
    <header class="page-header">
      <h1 class="page-title">中国古代建筑领域杰出科学家</h1>
      <p class="page-subtitle">从鲁班到样式雷，跨越两千五百年的建筑巨匠</p>
    </header>
    
    <div class="dashboard-grid">
      <!-- 左侧：时间轴 -->
      <div class="chart-panel panel-timeline">
        <h2 class="panel-title">建筑科学家时间轴</h2>
        <div id="timeline-chart" class="chart-container"></div>
      </div>
      
      <!-- 中间：关系图 -->
      <div class="chart-panel panel-graph">
        <h2 class="panel-title">人物-作品-朝代关联网络</h2>
        <div id="graph-chart" class="chart-container"></div>
      </div>
      
      <!-- 右上：人物卡片 -->
      <div class="chart-panel">
        <h2 class="panel-title">重点人物</h2>
        <div id="person-card" class="chart-container">
          <div class="person-info">
            <h3>点击左侧图表查看详情</h3>
          </div>
        </div>
      </div>
      
      <!-- 右下：影响力统计 -->
      <div class="chart-panel">
        <h2 class="panel-title">人物影响力指标</h2>
        <div id="bar-chart" class="chart-container"></div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
