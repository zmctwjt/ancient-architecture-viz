<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建筑文化 - 千年营造·华夏砖木</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="/js/flexible.js"></script>
  <script type="importmap">
  {
    "imports": {
      "echarts": "https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.esm.min.js",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.7/+esm"
    }
  }
  </script>
  <style>
    .page-wrapper {
      width: 100%;
      min-height: 100vh;
      background: var(--bg-dark);
      position: relative;
      padding: 0.2rem;
    }
    .tab-container {
      display: flex;
      gap: 0.15rem;
      margin-bottom: 0.2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 0.1rem 0.24rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      color: var(--color-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.14rem;
    }
    .tab-btn:hover, .tab-btn.active {
      background: linear-gradient(135deg, var(--color-primary) 0%, #D4B896 100%);
      color: var(--bg-dark);
      border-color: var(--color-primary);
    }
    .culture-content {
      display: none;
    }
    .culture-content.active {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.15rem;
      height: calc(100vh - 2.5rem);
      padding: 0 0.15rem;
    }
    .culture-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.15rem;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      position: relative;
    }
    .culture-card:hover {
      box-shadow: var(--border-glow);
      border-color: rgba(200, 169, 110, 0.5);
    }
    .culture-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-primary), var(--color-secondary), transparent);
      opacity: 0.6;
    }
    .culture-card h4 {
      color: var(--color-primary);
      margin-bottom: 0.1rem;
      font-size: 0.16rem;
      text-align: center;
      border-left: 3px solid var(--color-primary);
      padding-left: 0.1rem;
    }
    .culture-card .chart {
      flex: 1;
      min-height: 0;
    }
    .culture-desc {
      margin-top: 0.1rem;
      padding: 0.1rem;
      background: rgba(13, 17, 23, 0.5);
      border-radius: 5px;
      font-size: 0.12rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .back-link {
      position: fixed;
      top: 0.2rem;
      left: 0.2rem;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.14rem;
      z-index: 100;
      padding: 0.08rem 0.15rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
      transition: all 0.3s ease;
    }
    .back-link:hover {
      background: rgba(200, 169, 110, 0.1);
    }
    .chart-hint {
      position: absolute;
      bottom: 0.05rem;
      right: 0.1rem;
      font-size: 0.1rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
    @media (max-width: 768px) {
      .culture-content.active {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        height: auto;
      }
      .culture-card {
        min-height: 3rem;
      }
    }
  </style>
</head>
<body>
  <!-- 返回按钮 -->
  <a href="../../../index.html" class="back-link">← 返回首页</a>

  <!-- 主容器 -->
  <div class="page-wrapper">
    <!-- 顶部标题 -->
    <header class="page-header">
      <h1 class="page-title">建筑文化</h1>
      <p class="page-subtitle">民居·官府·皇宫·桥梁 - 华夏建筑文明传承</p>
    </header>

    <!-- 标签切换 -->
    <div class="tab-container">
      <button class="tab-btn active" data-tab="residence">🏠 民居文化</button>
      <button class="tab-btn" data-tab="official">🏛️ 官府文化</button>
      <button class="tab-btn" data-tab="palace">👑 皇宫文化</button>
      <button class="tab-btn" data-tab="bridge">🌉 桥梁文化</button>
    </div>

    <!-- 民居文化 -->
    <div id="residence" class="culture-content active">
      <div class="culture-card">
        <h4>地域分布</h4>
        <div id="residenceMap" class="chart"></div>
        <span class="chart-hint">点击查看详情</span>
      </div>
      <div class="culture-card">
        <h4>性能对比</h4>
        <div id="residenceRadar" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>结构类型</h4>
        <div id="residenceType" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>材料构成</h4>
        <div id="residenceMaterial" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>工艺特色</h4>
        <div id="residenceCraft" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>文化符号</h4>
        <div id="residenceSymbol" class="chart"></div>
      </div>
    </div>

    <!-- 官府文化 -->
    <div id="official" class="culture-content">
      <div class="culture-card">
        <h4>历代分布</h4>
        <div id="officialMap" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>等级制度</h4>
        <div id="officialLevel" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>功能布局</h4>
        <div id="officialLayout" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>现存代表</h4>
        <div id="officialRepresent" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>建筑特征</h4>
        <div id="officialFeature" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>历史演变</h4>
        <div id="officialEvolution" class="chart"></div>
      </div>
    </div>

    <!-- 皇宫文化 -->
    <div id="palace" class="culture-content">
      <div class="culture-card">
        <h4>历代规模</h4>
        <div id="palaceScale" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>布局形制</h4>
        <div id="palaceLayout" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>建筑等级</h4>
        <div id="palaceLevel" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>色彩象征</h4>
        <div id="palaceColor" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>装饰艺术</h4>
        <div id="palaceDecor" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>现存宫殿</h4>
        <div id="palaceExist" class="chart"></div>
      </div>
    </div>

    <!-- 桥梁文化 -->
    <div id="bridge" class="culture-content">
      <div class="culture-card">
        <h4>地域分布</h4>
        <div id="bridgeMap" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>结构类型</h4>
        <div id="bridgeType" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>材料演进</h4>
        <div id="bridgeMaterial" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>世界之最</h4>
        <div id="bridgeWorld" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>文化意义</h4>
        <div id="bridgeCulture" class="chart"></div>
      </div>
      <div class="culture-card">
        <h4>保护现状</h4>
        <div id="bridgeProtect" class="chart"></div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
